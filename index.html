<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florența MAX</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family: sans-serif; background:#111; color:#eee; }
header { background:#8B0000; padding:10px; text-align:center; }
button { margin:5px; padding:8px; border:none; border-radius:8px; }

#map { height:250px; }

.day { padding:10px; }

.progress { height:5px; background:#333; }
.bar { height:100%; background:#00ff88; width:0%; }

.poi { margin:5px 0; }
</style>
</head>

<body>

<header>
Florența MAX 👶🔥
<br>
<button onclick="locate()">📍 Locate me</button>
<button onclick="nextSpot()">🎯 Next</button>
</header>

<div id="map"></div>

<div class="day">
<h3>Day 1</h3>
<div class="progress"><div class="bar"></div></div>

<div class="poi"><input type="checkbox"> Duomo</div>
<div class="poi"><input type="checkbox"> Baptisteriu</div>
<div class="poi"><input type="checkbox"> Giotto Tower</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// MAP INIT
let map = L.map('map').setView([43.773, 11.256], 14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
}).addTo(map);

// POI LOCATIONS
const spots = [
{ name:"Duomo", lat:43.7731, lng:11.2560 },
{ name:"Gelato La Carraia", lat:43.7695, lng:11.2472 }
];

// ADD MARKERS
spots.forEach(s=>{
    L.marker([s.lat,s.lng]).addTo(map).bindPopup(s.name);
});

let userMarker;

// GEOLOCATION
function locate(){
navigator.geolocation.watchPosition(pos=>{
    let lat=pos.coords.latitude;
    let lng=pos.coords.longitude;

    if(userMarker){ map.removeLayer(userMarker); }

    userMarker = L.marker([lat,lng]).addTo(map)
    .bindPopup("Tu ești aici").openPopup();

    map.setView([lat,lng],15);

    checkNearby(lat,lng);
});
}

// PROXIMITY ALERT
function checkNearby(lat,lng){
spots.forEach(s=>{
let d = Math.sqrt((lat-s.lat)**2+(lng-s.lng)**2);
if(d < 0.002){
alert("Ești lângă " + s.name + " 🍦");
}
});
}

// NEXT SPOT NAV
function nextSpot(){
let next = spots[0];
window.open(`https://www.google.com/maps/dir/?api=1&destination=${next.lat},${next.lng}`);
}

// CHECKBOX SAVE + SCORE
document.querySelectorAll("input").forEach((cb,i)=>{
cb.checked = localStorage.getItem(i)=="true";
cb.onchange=()=>{
localStorage.setItem(i, cb.checked);
update();
}
});

function update(){
let c=document.querySelectorAll("input");
let ch=document.querySelectorAll("input:checked");
document.querySelector(".bar").style.width=(ch.length/c.length*100)+"%";
}
update();

</script>

</body>
</html>
